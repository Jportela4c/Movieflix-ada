name: CI/CD (Docker Compose)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_IMAGE:   jportela4c/movieflix-app
  NGINX_IMAGE: jportela4c/movieflix-nginx
  ETL_IMAGE:   jportela4c/movieflix-etl

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- BUILD ----------
      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: ${{ env.APP_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: false
          tags: ${{ env.NGINX_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build etl image
        uses: docker/build-push-action@v5
        with:
          context: ./etl
          push: false
          tags: ${{ env.ETL_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- TESTE (corrigido com alias 'app') ----------
      - name: Start services (app + nginx) for integration test
        run: |
          docker network create movieflix-ci || true

          docker run -d --rm --name app_test --network movieflix-ci \
            --network-alias app \
            -e PORT=8000 \
            ${{ env.APP_IMAGE }}:ci

          docker run -d --rm --name nginx_test --network movieflix-ci -p 8080:80 \
            ${{ env.NGINX_IMAGE }}:ci

          for i in {1..40}; do
            sleep 1
            if curl -fsS http://localhost:8080/health | grep -q '"ok"'; then
              echo "App OK"; exit 0
            fi
          done
          echo "Falha ao validar /health via Nginx"
          docker logs app_test || true
          docker logs nginx_test || true
          exit 1

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f nginx_test || true
          docker rm -f app_test || true
          docker network rm movieflix-ci || true

      # ---------- PUSH (somente main) ----------
      - name: Push app image (latest + sha)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.APP_IMAGE }}:ci ${{ env.APP_IMAGE }}:latest
          docker tag ${{ env.APP_IMAGE }}:ci ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker push ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Push nginx image (latest + sha)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.NGINX_IMAGE }}:ci ${{ env.NGINX_IMAGE }}:latest
          docker tag ${{ env.NGINX_IMAGE }}:ci ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          docker push ${{ env.NGINX_IMAGE }}:latest
          docker push ${{ env.NGINX_IMAGE }}:${{ github.sha }}

      - name: Push etl image (latest + sha)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.ETL_IMAGE }}:ci ${{ env.ETL_IMAGE }}:latest
          docker tag ${{ env.ETL_IMAGE }}:ci ${{ env.ETL_IMAGE }}:${{ github.sha }}
          docker push ${{ env.ETL_IMAGE }}:latest
          docker push ${{ env.ETL_IMAGE }}:${{ github.sha }}
